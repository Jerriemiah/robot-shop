apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    service: web
spec:
  replicas: 1
  selector:
    matchLabels:
      service: web
  template:
    metadata:
      labels:
        service: web
    spec:
      volumes:
      - name: nginx-logs
        emptyDir: {}
      - name: exporter-config
        configMap:
          name: web-nginx-log-exporter

      - name: nginx-config
        configMap:
          name: web-nginx-config
      {{- if .Values.psp.enabled }}
      serviceAccountName: robot-shop
      {{- end }}
      containers:
      - name: web
        image: {{ .Values.image.repo }}/rs-web:{{ .Values.image.version }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        {{- if .Values.eum.key }}
        env:
        - name: INSTANA_EUM_KEY
          value: {{ .Values.eum.key }}
        - name: INSTANA_EUM_REPORTING_URL
          value: {{ .Values.eum.url }}
        {{- end }}
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: 200m
            memory: 100Mi
          requests:
            cpu: 100m
            memory: 50Mi
        volumeMounts:
        - name: nginx-logs
          mountPath: /var/log/nginx

        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
          readOnly: true
      - name: nginx-log-exporter
        image: quay.io/martinhelmich/prometheus-nginxlog-exporter:v1.11.0
        args:
        - -config-file
        - /etc/prometheus-nginxlog-exporter/config.hcl
        ports:
        - name: metrics
          containerPort: 4040
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 50m
            memory: 32Mi
        volumeMounts:
        - name: nginx-logs
          mountPath: /var/log/nginx
        - name: exporter-config
          mountPath: /etc/prometheus-nginxlog-exporter
          readOnly: true

      restartPolicy: Always
      {{- with .Values.web.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
