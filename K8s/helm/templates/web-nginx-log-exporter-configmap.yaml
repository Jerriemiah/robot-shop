apiVersion: v1
kind: ConfigMap
metadata:
  name: web-nginx-log-exporter
  labels:
    service: web
data:
  config.hcl: |
    listen {
      port = 4040
    }

    namespace "nginx" {
      format = "$remote_addr - $remote_user [$time_local] \"$request\" $status $body_bytes_sent \"$http_referer\" \"$http_user_agent\" \"$http_x_forwarded_for\" rt=$request_time"

      source {
        files = [
          "/var/log/nginx/access.log"
        ]
      }

      labels {
        app = "robot-shop"
        service = "web"
      }
    }
